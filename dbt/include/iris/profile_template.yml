fixed:
  type: iris
prompts:
  hostname:
    hint: "IRIS host name, for example localhost"
  port:
    default: 1972
    type: int
  database:
    hint: "IRIS namespace, for example USER"
  username:
    hint: "IRIS user"
  password:
    hint: "IRIS password"
    hide_input: true
  schema:
    hint: "default SQL schema for dbt models"
  threads:
    hint: "1 or more"
    type: int
    default: 1
