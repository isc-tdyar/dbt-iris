# **what?**
# Runs code quality checks, unit tests, and verifies python build on
# all code commited to the repository. This workflow should not
# require any secrets since it runs for PRs from forked repos.
# By default, secrets are not passed to workflows running from
# a forked repo.

# **why?**
# Ensure code for dbt meets a certain quality standard.

# **when?**
# This will run for all PRs, when code is pushed to a release
# branch, and when manually triggered.

name: Tests and Code Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - released

permissions: write-all

# will cancel previous workflows triggered by the same event and for the same ref for PRs or same SHA otherwise
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ contains(github.event_name, 'pull_request') && github.event.pull_request.head.ref || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  code-quality:
    name: code-quality

    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12

      - name: Install python dependencies
        run: |
          pip install --user --upgrade pip
          pip install pre-commit tox
          pip install -r requirements-dev.txt
          pip --version
          pre-commit --version
          mypy --version
          dbt --version

      - name: Run unit tests
        run: |
          tox -e py310,py311,py312

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  # dbt-tests-adapter suites against IRIS Community release images, run as a service container.
  functional:
    name: functional (${{ matrix.image }}, Python ${{ matrix.python }}, dbt ${{ matrix.dbt-core }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - containers.intersystems.com/intersystems/iris-community:latest-cd
          - containers.intersystems.com/intersystems/iris-community:latest-preview
        python:
          - "3.10"
          - "3.11"
          - "3.12"
        dbt-core:
          - "1.11"
          - "1.12"
        # The oldest supported IRIS, 2026.1 (latest-em), in one job.
        include:
          - image: containers.intersystems.com/intersystems/iris-community:latest-em
            python: "3.12"
            dbt-core: "1.12"
    services:
      iris:
        image: ${{ matrix.image }}
        ports:
          - 1972:1972
    env:
      DBT_IRIS_HOST: localhost
      DBT_IRIS_PORT: "1972"
      DBT_IRIS_USER: SuperUser
      DBT_IRIS_PASS: SYS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Wait for IRIS and unexpire the default passwords
        run: |
          for _ in $(seq 1 60); do
            docker exec ${{ job.services.iris.id }} iris qlist | grep -q running && break
            sleep 5
          done
          printf ' do ##class(Security.Users).UnExpireUserPasswords("*")\n halt\n' \
            | docker exec -i ${{ job.services.iris.id }} iris session IRIS -U %SYS
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e . "dbt-core~=${{ matrix.dbt-core }}.0" dbt-tests-adapter "pytest~=7.4" pytest-dotenv flaky freezegun
          pip list | grep -i -E "^dbt-|irispython"
      - name: Functional tests
        run: python -m pytest -q -rs tests/functional

  # Python models run inside IRIS's Embedded Python and need pandas and sqlalchemy-iris there.
  python-models:
    name: python-models
    runs-on: ubuntu-latest
    services:
      iris:
        image: containers.intersystems.com/intersystems/iris-community:latest-preview
        ports:
          - 1972:1972
    env:
      DBT_IRIS_HOST: localhost
      DBT_IRIS_PORT: "1972"
      DBT_IRIS_USER: SuperUser
      DBT_IRIS_PASS: SYS
      DBT_IRIS_PYTHON_MODELS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Wait for IRIS, unexpire passwords, install packages into IRIS's Python
        run: |
          for _ in $(seq 1 60); do
            docker exec ${{ job.services.iris.id }} iris qlist | grep -q running && break
            sleep 5
          done
          printf ' do ##class(Security.Users).UnExpireUserPasswords("*")\n halt\n' \
            | docker exec -i ${{ job.services.iris.id }} iris session IRIS -U %SYS
          docker exec ${{ job.services.iris.id }} sh -c \
            'python3 -m venv /tmp/pipv && /tmp/pipv/bin/pip install -q --target /usr/irissys/mgr/python pandas sqlalchemy sqlalchemy-iris'
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e . dbt-tests-adapter "pytest~=7.4" pytest-dotenv flaky freezegun
      - name: Python model tests
        run: python -m pytest -q -rs tests/functional/adapter/test_python_model.py tests/functional/adapter/test_hash.py

  build:
    needs:
      - code-quality
      - functional
      - python-models
    name: build packages

    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git fetch --depth=1 origin '+refs/tags/*:refs/tags/*'
        continue-on-error: true
      - name: set version
        id: set-version
        run: |
          VERSION=$(sed -n '0,/version = \(.*\)/s//\1/p' dbt/adapters/iris/__version__.py | tr -d '"' )
          [ "$GITHUB_EVENT_NAME" == 'release' ] && VERSION=${{ github.event.release.tag_name }} && VERSION=${VERSION/v/}
          [ "$GITHUB_EVENT_NAME" == 'push' ] && VERSION+=b$(($(git tag -l "v${VERSION}b*" | sort -nt. -k4 2>/dev/null | tail -1 | cut -d b -f2)+1))
          [ "$GITHUB_EVENT_NAME" == 'pull_request' ] && VERSION+=-dev.${{ github.event.pull_request.number }}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          sed -i "s/version = .*/version = \"${VERSION}\"/" dbt/adapters/iris/__version__.py
          sed -i "s/package_version = .*/package_version = \"${VERSION}\"/" setup.py
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install python dependencies
        run: |
          pip install --user --upgrade pip
          pip install --upgrade setuptools wheel twine check-wheel-contents tox
          pip --version

      - name: Build distributions
        run: |
          ./scripts/build-dist.sh

      - name: Show distributions
        run: ls -lh dist/

      - name: Check distribution descriptions
        run: |
          twine check dist/*
      - name: Check wheel contents
        run: |
          check-wheel-contents dist/*.whl --ignore W007,W008,W009
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: dist
          path: dist/dbt_iris-${{ steps.set-version.outputs.version }}-py3-none-any.whl
      - name: Create Release
        id: create-release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: v${{ steps.set-version.outputs.version }}
          prerelease: ${{ github.event_name != 'release' }}
          files: dist/dbt_iris-${{ steps.set-version.outputs.version }}-py3-none-any.whl
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish package
        if: github.event_name != 'pull_request'
        uses: pypa/gh-action-pypi-publish@release/v1
      - uses: actions/checkout@v4
        if: github.event_name == 'release'
        with:
          ref: main
      - name: Bump version
        if: github.event_name == 'release'
        run: |
          git config --global user.name 'ProjectBot'
          git config --global user.email 'bot@users.noreply.github.com'
          VERSION=${{ github.event.release.tag_name }} && VERSION=${VERSION/v/}
          VERSION=$(echo "$VERSION" | awk -F. '/[0-9]+\./{$NF++;print}' OFS=.)
          sed -i "s/version = .*/version = \"${VERSION}\"/" dbt/adapters/iris/__version__.py
          sed -i "s/package_version = .*/package_version = \"${VERSION}\"/" setup.py
          git add dbt/adapters/iris/__version__.py
          git add setup.py
          git commit -m 'auto bump version with release'
          git push
